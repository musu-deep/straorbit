name: Bootstrap STRAORBIT source

on:
  pull_request:
    branches: [main]
    paths:
      - ".upload/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore and verify source
        run: |
          cat .upload/part-* | base64 --decode > /tmp/straorbit-source.tar.gz
          echo "f38ba7275f990693fd4e44e1da6831e8ca02b4f0dccfc3787270827ae0590c76  /tmp/straorbit-source.tar.gz" | sha256sum --check
          mkdir -p /tmp/straorbit-source
          tar -xzf /tmp/straorbit-source.tar.gz -C /tmp/straorbit-source
          rsync -a --delete --exclude .git --exclude .upload /tmp/straorbit-source/ ./
          rm -rf .upload
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare STRAORBIT for production" || exit 0
          git push origin HEAD:${{ github.head_ref }}
